# Fly.io em Sao Paulo (gru), na mesma cidade do Supabase (sa-east-1).
app = "agendei"
primary_region = "gru"

[http_service]
  internal_port = 80
  force_https = true
  # Suspende sem acesso e acorda no proximo (cobra so o tempo ligada); o agendador
  # externo que chama tarefas.php tambem acorda a maquina.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # 512 MB: o Dockerfile limita o Apache a 8 processos pensando nesse tamanho.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
